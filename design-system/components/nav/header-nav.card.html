<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-surface-page);font-family:var(--font-primary)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.lbl{font-size:11px;color:var(--color-text-muted);width:100%;margin-bottom:4px}</style>
<div id="root"></div>
<script type="text/babel">
const { CabeAlho, TopNav, ButtonIcon, ButtonWeb350p, BotOCone, PaginationControl, PaginatorCount, PaginatorIcon, MenuBarButton, MenuBarColorPickerDropdown, TableTitle, TagGray, Link, ControlOption, Slider1, Radio, Step } = window.DesignSystem_88f6a8;
function App(){
  return (<div>
    <div className="lbl">Cabeçalho (header)</div>
    <div className="row" style={{width:"100%"}}><CabeAlho/></div>
    <div className="lbl">Top nav strip</div>
    <div className="row" style={{width:"100%"}}><TopNav/></div>
    <div className="lbl">Icon button — type × status</div>
    <div className="row">{["simple","solid","outline"].map(t=>["active","hover","disabled"].map(s=><ButtonIcon key={t+s} type={t} status={s}/>))}</div>
    <div className="lbl">Pagination control</div>
    <div className="row"><PaginationControl/><PaginatorCount text1="2"/><PaginatorIcon/></div>
    <div className="lbl">Menu bar buttons</div>
    <div className="row"><MenuBarButton state="default"/><MenuBarButton state="active"/><MenuBarColorPickerDropdown/></div>
    <div className="lbl">Table title / Tag gray / Link</div>
    <div className="row" style={{width:"100%"}}><TableTitle/></div>
    <div className="row"><TagGray/><Link/></div>
    <div className="lbl">Control option / Radio / Step</div>
    <div className="row">{["default","selected","hover","disabled"].map(s=><ControlOption key={s} state={s}/>)}<Radio state="selected"/><Step type="1"/></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
