<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-surface-page);font-family:var(--font-primary)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.lbl{font-size:11px;color:var(--color-text-muted);width:100%;margin-bottom:4px}</style>
<div id="root"></div>
<script type="text/babel">
const { Button2, Tag, ControlCheckbox, ControlRadio, Input, Dropdown, Hyperlink } = window.DesignSystem_88f6a8;
function App(){
  return (<div>
    <div className="lbl">Button — emphasis × state</div>
    <div className="row">
      {["primary","secundary","tertiary"].map(e=>["default","hover","pressed","disabled"].map(s=>
        <Button2 key={e+s} emphasis={e} state={s} text1={e+" / "+s}/>))}
    </div>
    <div className="lbl">Tag — type</div>
    <div className="row">{["interactive","status","text","icon","score"].map(t=><Tag key={t} type={t} text1={t}/>)}</div>
    <div className="lbl">Checkbox / Radio — state</div>
    <div className="row">
      {["default","selected","hover","focused","disabled","intermediate"].map(s=><ControlCheckbox key={s} state={s}/>)}
      {["default","selected","hover","focused","disabled"].map(s=><ControlRadio key={"r"+s} state={s}/>)}
    </div>
    <div className="lbl">Input — state</div>
    <div className="row">
      {["default","active","error","disabled"].map(s=><Input key={s} state={s} text1={s}/>)}
    </div>
    <div className="lbl">Dropdown — state</div>
    <div className="row">{["default","active","error"].map(s=><Dropdown key={s} state={s}/>)}</div>
    <div className="lbl">Hyperlink</div>
    <div className="row"><Hyperlink state="default"/><Hyperlink state="hover"/></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
