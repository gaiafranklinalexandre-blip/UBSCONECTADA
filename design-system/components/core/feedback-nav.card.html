<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-surface-page);font-family:var(--font-primary)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.lbl{font-size:11px;color:var(--color-text-muted);width:100%;margin-bottom:4px}</style>
<div id="root"></div>
<script type="text/babel">
const { MessageFeedback, StepIndicator, Loading, ToolTip, Pagination, Divider, ButtonCircleInterativo } = window.DesignSystem_88f6a8;
function App(){
  return (<div>
    <div className="lbl">Message feedback — state</div>
    <div className="row">{["info","sucess","warning","danger"].map(s=><MessageFeedback key={s} state={s}/>)}</div>
    <div className="lbl">Step indicator — type × state</div>
    <div className="row">
      {["simple","number","icon"].map(t=>["default","actived","complete","disabled"].map(s=>
        <StepIndicator key={t+s} type={t} state={s} text1="1"/>))}
    </div>
    <div className="lbl">Loading</div>
    <div className="row"><Loading type="default"/><Loading type="inderteminate"/><ButtonCircleInterativo primary="progress-primary"/></div>
    <div className="lbl">ToolTip</div>
    <div className="row" style={{minHeight:80}}>{["azul","verde","amarelo","vermelho"].map(c=><ToolTip key={c} cor={c} arrow="down" showInfo={true} tTulo="Título" info="Texto de apoio"/>)}</div>
    <div className="lbl">Pagination</div>
    <div className="row"><Pagination/></div>
    <div className="lbl">Divider</div>
    <div className="row" style={{flexDirection:"column",alignItems:"stretch"}}><Divider style2="linha"/><Divider style2="tracejado"/></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
