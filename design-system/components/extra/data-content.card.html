<!-- @dsCard group="Components" viewport="700x1400" name="Data & Content" subtitle="Item, Status, Upload, Warning, Balance card, Column/Table headers, Lists" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-surface-page);font-family:var(--font-primary)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.lbl{font-size:11px;color:var(--color-text-muted);width:100%;margin-bottom:4px}</style>
<div id="root"></div>
<script type="text/babel">
const { Status, Upload, Warning, Component1, ColumnHeader, TableHeader, List, DropdownListItem, ColorPickerListItem, AssignTo, PM, Resources, Project, LegendaVariaveis } = window.DesignSystem_88f6a8;
function App(){
  return (<div>
    <div className="lbl">Status</div>
    <div className="row">{["not started","in progress","completed"].map(s=><Status key={s} status={s} text1={s}/>)}</div>
    <div className="lbl">Balance card (Component 1)</div>
    <div className="row">
      <Component1 card="full" saldo="disponivel"/><Component1 card="full" saldo="indisp"/><Component1 card="full" saldo="preench"/>
    </div>
    <div className="lbl">Upload — state</div>
    <div className="row">{["upload","loading","sucess","danger"].map(s=><Upload key={s} state={s}/>)}</div>
    <div className="lbl">Warning (INE)</div>
    <div className="row">{["insuficiente","obrigatório","opcional"].map(s=><Warning key={s} ine={s}/>)}</div>
    <div className="lbl">Column header / Table header</div>
    <div className="row"><ColumnHeader state="default" text1="Nome"/><ColumnHeader state="selected" text1="Data"/><TableHeader/></div>
    <div className="lbl">List / dropdown / color-picker items</div>
    <div className="row" style={{flexDirection:"column",alignItems:"stretch",maxWidth:280}}>
      <List text1="Opção 1"/><DropdownListItem text="Opção 2"/><ColorPickerListItem/>
    </div>
    <div className="lbl">Assignee avatars / PM</div>
    <div className="row">{["aman","david","sarah","john"].map(n=><AssignTo key={n} name={n}/>)}<PM/></div>
    <div className="lbl">Resources / Project</div>
    <div className="row"><Resources text1="3"/><Project text1="Indicador"/></div>
    <div className="lbl">Legenda de variáveis (progress legend)</div>
    <div className="row" style={{flexDirection:"column",alignItems:"stretch",maxWidth:500}}><LegendaVariaveis/></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
